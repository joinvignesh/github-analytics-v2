version: 2

models:
  - name: stg_github_issues
    description: Staged GitHub issues with typed columns
    columns:
      - name: issue_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      
      - name: state
        description: Current state of the issue
        tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
              config: # Fixed: This is now vertically aligned with 'values'
                severity: warn
      
      - name: created_at
        tests:
          - not_null:
              config:
                severity: warn
  
  - name: stg_github_repositories
    columns:
      - name: repository_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      
      - name: repository_name
        tests:
          - not_null:
              config:
                severity: warn
  
  - name: stg_github_comments
    columns:
      - name: comment_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn