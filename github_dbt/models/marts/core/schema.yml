version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: dim_repository
    columns:
      - name: repository_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: popularity_tier
        tests:
          - accepted_values:
              values: ['Very Popular (10K+ stars)', 'Popular (1K-10K stars)', 'Growing (100-1K stars)', 'Emerging (<100 stars)']
              config: # Fixed: Moved out of the 'values' list
                severity: warn

  - name: fct_repo_activity_daily
    columns:
      - name: repository_id
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: ref('dim_repository')
              field: repository_id
              config: # Fixed: Added config wrapper
                severity: error
      - name: total_issues_created
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: # Fixed: Moved out of 'expression'
                severity: warn

  - name: fct_issue_lifecycle
    columns:
      - name: issue_key
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: status_label
        tests:
          - accepted_values:
              values: ['Open', 'Closed', 'Unknown']
              config: # Fixed: Moved out of 'values'
                severity: warn
      - name: lifecycle_stage
        tests:
          - accepted_values:
              values: ['Completed', 'Stale', 'Long-running', 'Active']
              config: 
                severity: warn
      - name: duration_days
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config: # Fixed: Moved out of 'expression'
                severity: error

  - name: fct_issue_comments
    columns:
      - name: comment_key
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: issue_id
        tests:
          - relationships:
              to: ref('fct_issue_lifecycle')
              field: issue_id
              config: # Fixed: Moved out of 'field'
                severity: error

  - name: view_ISSUE_TIMELINE_GANTT2
    description: "Unpivoted issue events (open, closed, comments) for Gantt chart dual-axis visualization."
    columns:
      - name: issue_id
        tests:
          - not_null: { severity: error }
      - name: event_type
        tests:
          - accepted_values:
              values: ['ISSUE_DURATION', 'COMMENT']
              config: { severity: error }
      - name: event_date
        description: "The point in time the event occurred."
        tests:
          - not_null: { severity: error }
      - name: issue_opened_at
        description: "Start of the Gantt bar."
        tests:
          - not_null: { severity: error }
      - name: issue_closed_at
        description: "End of the Gantt bar (current timestamp if open)."
        tests:
          - not_null: { severity: error }